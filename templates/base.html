<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}陳建安工作室{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 載入遮罩樣式 */
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }
        .spinner-border-custom {
            width: 3rem;
            height: 3rem;
            border: 0.4em solid #f3f3f3;
            border-top: 0.4em solid #ffc107;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-light">

    <!-- 🚀 伺服器載入中提示遮罩 -->
    <div id="loading-overlay">
        <div class="spinner-border-custom"></div>
        <h4 class="mt-3 fw-bold text-warning">🚀 伺服器正在熱機中，請稍候...</h4>
        <p class="text-light mt-1 mb-0" style="font-size: 14px;">免費主機首次連線或提交資料需要約 30 秒，請勿關閉網頁喔！</p>
    </div>

    <!-- 導覽列 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">陳建安技術服務與線上賣場</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    {% if session.get('logged_in_user') %}
                        <li class="nav-item me-3">
                            <span class="text-warning">會員：{{ session.get('logged_in_user') }} (享9折)</span>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-outline-light btn-sm" href="/user_logout">會員登出</a>
                        </li>
                    {% else %}
                        <li class="nav-item me-2"><a class="nav-link" href="/user_login">會員登入</a></li>
                        <li class="nav-item me-2"><a class="btn btn-success btn-sm" href="/register">註冊享9折</a></li>
                    {% endif %}
                    <li class="nav-item ms-2">
                        <a class="btn btn-outline-warning btn-sm" href="/login">後台管理</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主畫面內容容器：支援滿版延展 -->
    <div class="container-fluid px-4 mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 當使用者點擊表單送出（例如下單、登入、註冊）時自動跳出載入動畫
        document.addEventListener("DOMContentLoaded", function() {
            const forms = document.querySelectorAll("form");
            forms.forEach(form => {
                form.addEventListener("submit", function() {
                    document.getElementById("loading-overlay").style.display = "flex";
                });
            });
        });
    </script>
</body>
</html>
