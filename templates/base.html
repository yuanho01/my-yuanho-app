<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}陳建安工作室{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- 導覽列 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">陳建安技術服務與線上賣場</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    {% if session.get('logged_in_user') %}
                        <li class="nav-item me-3">
                            <span class="text-warning">會員：{{ session.get('logged_in_user') }} (享9折)</span>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-outline-light btn-sm" href="/user_logout">會員登出</a>
                        </li>
                    {% else %}
                        <li class="nav-item me-2"><a class="nav-link" href="/user_login">會員登入</a></li>
                        <li class="nav-item me-2"><a class="btn btn-success btn-sm" href="/register">註冊享9折</a></li>
                    {% endif %}
                    <li class="nav-item ms-2">
                        <a class="btn btn-outline-warning btn-sm" href="/login">後台管理</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主畫面內容容器：支援滿版延展 -->
    <div class="container-fluid px-4 mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
